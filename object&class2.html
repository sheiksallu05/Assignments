<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 28 JS Class & Objects</title>
</head>
<body>

<h2>Day 28 - Class & Objects</h2>

<script>

// ===========================
// Class 1 : Mobile
// ===========================

class Mobile {

    constructor(brand, model, price) {
        this.brand = brand;
        this.model = model;
        this.price = price;
    }

    display() {
        console.log("Brand : " + this.brand);
        console.log("Model : " + this.model);
        console.log("Price : ₹" + this.price);
        console.log("-------------------");
    }
}

let m1 = new Mobile("Samsung", "Galaxy A55", 35000);
let m2 = new Mobile("Realme", "Narzo 80", 18000);

m1.display();
m2.display();


// ===========================
// Class 2 : Book
// ===========================

class Book {

    constructor(title, author, price) {
        this.title = title;
        this.author = author;
        this.price = price;
    }

    display() {
        console.log("Book : " + this.title);
        console.log("Author : " + this.author);
        console.log("Price : ₹" + this.price);
        console.log("-------------------");
    }
}

let b1 = new Book("JavaScript Basics", "John", 550);

b1.display();


// ===========================
// Class 3 : Bank Account
// ===========================

class BankAccount {

    constructor(name, accountNo, balance) {
        this.name = name;
        this.accountNo = accountNo;
        this.balance = balance;
    }

    display() {
        console.log("Customer : " + this.name);
        console.log("Account No : " + this.accountNo);
        console.log("Balance : ₹" + this.balance);
        console.log("-------------------");
    }
}

let customer = new BankAccount("Salman", 123456789, 25000);

customer.display();


// ===========================
// Object Example
// ===========================

let laptop = {
    brand: "HP",
    ram: "16GB",
    processor: "Intel i5",

    display: function () {
        console.log("Brand : " + this.brand);
        console.log("RAM : " + this.ram);
        console.log("Processor : " + this.processor);
    }
};

laptop.display();

</script>

</body>
</html>
