<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 30 Promise Assignment</title>
</head>

<body>

    <h2>JavaScript Promise Assignment</h2>

    <script>

        // =====================================
        // 1. Addition using Promise
        // =====================================

        function calculate(a, b) {

            return new Promise((resolve) => {
                resolve(a + b);
            });

        }

        calculate(10, 20)
            .then((result) => {
                console.log("Addition = " + result);
            });


        // =====================================
        // 2. Greeting User
        // =====================================

        function greetUser(name) {

            return new Promise((resolve) => {
                resolve("Welcome " + name);
            });

        }

        greetUser("Salman")
            .then((message) => {
                console.log(message);
            });


        // =====================================
        // 3. Double Array Elements
        // =====================================

        function processArray(arr) {

            return new Promise((resolve) => {

                let result = arr.map(num => num * 2);

                resolve(result);

            });

        }

        processArray([1, 2, 3, 4, 5])
            .then((result) => {
                console.log(result);
            });


        // =====================================
        // 4. Positive Numbers
        // =====================================

        function filterNumbers(arr) {

            return new Promise((resolve) => {

                let result = arr.filter(num => num > 0);

                resolve(result);

            });

        }

        filterNumbers([-5, 10, -2, 20, 15])
            .then((result) => {
                console.log(result);
            });


        // =====================================
        // 5. First Even Number
        // =====================================

        function findNumber(arr) {

            return new Promise((resolve) => {

                let result = arr.find(num => num % 2 == 0);

                resolve(result);

            });

        }

        findNumber([5, 7, 9, 12, 18])
            .then((result) => {
                console.log(result);
            });


        // =====================================
        // 6. Remove Negative Values
        // =====================================

        function removeNegative(arr) {

            return new Promise((resolve) => {

                let result = arr.filter(num => num >= 0);

                resolve(result);

            });

        }

        removeNegative([-10, 5, -3, 20, 30])
            .then((result) => {
                console.log(result);
            });


        // =====================================
        // 7. Vote Eligibility
        // =====================================

        function checkEligibility(age) {

            return new Promise((resolve, reject) => {

                if (age >= 18)
                    resolve("Eligible to Vote");
                else
                    reject("Not Eligible to Vote");

            });

        }

        checkEligibility(21)
            .then((message) => {
                console.log(message);
            })
            .catch((error) => {
                console.log(error);
            });


        // =====================================
        // 8. Food Order
        // =====================================

        function orderFood() {

            return new Promise((resolve) => {

                setTimeout(() => {

                    resolve("Food is Ready");

                }, 3000);

            });

        }

        orderFood()
            .then((message) => {
                console.log(message);
            });


        // =====================================
        // 9. Sum of Array
        // =====================================

        function sumArray(arr) {

            return new Promise((resolve) => {

                let sum = arr.reduce((total, num) => total + num, 0);

                resolve(sum);

            });

        }

        sumArray([10, 20, 30, 40])
            .then((result) => {
                console.log("Sum = " + result);
            });


        // =====================================
        // 10. Sort Array
        // =====================================

        function sortArray(arr) {

            return new Promise((resolve) => {

                arr.sort((a, b) => a - b);

                resolve(arr);

            });

        }

        sortArray([25, 5, 40, 10, 30])
            .then((result) => {
                console.log(result);
            });

    </script>

</body>

</html>
