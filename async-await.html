<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 31 Async/Await Assignment</title>
</head>

<body>

    <h2>JavaScript Async / Await</h2>

    <script>

        // =======================================
        // 1. Addition
        // =======================================

        async function calculate(a, b) {

            return a + b;

        }

        async function task1() {

            let result = await calculate(10, 20);

            console.log("Addition = " + result);

        }

        task1();


        // =======================================
        // 2. Greeting User
        // =======================================

        async function greetUser(name) {

            return "Welcome " + name;

        }

        async function task2() {

            let message = await greetUser("Salman");

            console.log(message);

        }

        task2();


        // =======================================
        // 3. Double Array Elements
        // =======================================

        async function processArray(arr) {

            return arr.map(num => num * 2);

        }

        async function task3() {

            let result = await processArray([1, 2, 3, 4, 5]);

            console.log(result);

        }

        task3();


        // =======================================
        // 4. Positive Numbers
        // =======================================

        async function filterNumbers(arr) {

            return arr.filter(num => num > 0);

        }

        async function task4() {

            let result = await filterNumbers([-5, 10, -2, 20, 30]);

            console.log(result);

        }

        task4();


        // =======================================
        // 5. First Even Number
        // =======================================

        async function findNumber(arr) {

            return arr.find(num => num % 2 == 0);

        }

        async function task5() {

            let result = await findNumber([5, 7, 9, 12, 15]);

            console.log(result);

        }

        task5();


        // =======================================
        // 6. Remove Negative Numbers
        // =======================================

        async function removeNegative(arr) {

            return arr.filter(num => num >= 0);

        }

        async function task6() {

            let result = await removeNegative([-5, 10, -3, 20]);

            console.log(result);

        }

        task6();


        // =======================================
        // 7. Vote Eligibility
        // =======================================

        async function checkEligibility(age) {

            if (age >= 18)
                return "Eligible to Vote";
            else
                return "Not Eligible";

        }

        async function task7() {

            let result = await checkEligibility(21);

            console.log(result);

        }

        task7();


        // =======================================
        // 8. Food Order (3 Seconds)
        // =======================================

        function orderFood() {

            return new Promise(function (resolve) {

                setTimeout(function () {

                    resolve("Food is Ready");

                }, 3000);

            });

        }

        async function task8() {

            let result = await orderFood();

            console.log(result);

        }

        task8();


        // =======================================
        // 9. Sum of Array
        // =======================================

        async function sumArray(arr) {

            return arr.reduce((a, b) => a + b, 0);

        }

        async function task9() {

            let result = await sumArray([10, 20, 30, 40]);

            console.log("Sum = " + result);

        }

        task9();


        // =======================================
        // 10. Sort Array
        // =======================================

        async function sortArray(arr) {

            return arr.sort((a, b) => a - b);

        }

        async function task10() {

            let result = await sortArray([25, 5, 40, 10, 30]);

            console.log(result);

        }

        task10();

    </script>

</body>

</html>
