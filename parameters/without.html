        //---------9----------
        function factorialSeries() {

            let sum = 0;

            for (let i = 1; i <= 5; i++) {

                let fact = 1;

                for (let j = 1; j <= i; j++) {
                    fact *= j;
                }

                sum += i / fact;
            }

            console.log(sum);
        }

        factorialSeries();

        function evenFactorialSeries() {

            let sum = 0;

                    fact *= j;
                }

                sum += i / fact;
            }

        }

        evenFactorialSeries();

        function oddFactorialSeries() {

        }

        //---------13---------
        function primeCheck() {

            let n = 17;
            let prime = true;

            for (let i = 2; i < n; i++) {
                if (n % i == 0) {
                    prime = false;
                    break;
                }
            }

            if (prime)
                console.log("Prime");
            else
                console.log("Not Prime");
        }

        primeCheck();
        //---------14---------
        function primeSeries() {

            for (let i = 2; i <= 20; i++) {

                let prime = true;

                for (let j = 2; j < i; j++) {
                    if (i % j == 0) {
                        prime = false;
                        break;
                    }
                }

                if (prime)
                    console.log(i + " ");
            }
        }

        primeSeries();
        //---------15---------
        function armstrong() {

            let num = 153;
            let temp = num;
            let sum = 0;

            while (temp > 0) {
                let digit = temp % 10;
                sum += digit * digit * digit;
                temp = parseInt(temp / 10);
            }

            if (sum == num)
                console.log("Armstrong Number");
            else
                console.log("Not Armstrong Number");
        }

        armstrong();
        //---------16---------
        function armstrongSeries() {

            for (let i = 1; i <= 500; i++) {

                let temp = i;
                let sum = 0;

                while (temp > 0) {
                    let digit = temp % 10;
                    sum += digit * digit * digit;
                    temp = parseInt(temp / 10);
                }

                if (sum == i) {
                    console.log(i + " ");
                }
            }
        }

        armstrongSeries();
        //---------17---------
        function fibonacci() {

            let a = 0;
            let b = 1;

            console.log(a + " " + b + " ");

            for (let i = 3; i <= 10; i++) {
                let c = a + b;
                console.log(c + " ");
                a = b;
                b = c;
            }
        }

        fibonacci();

        //---------19----------
        function sumDigit() {

            let num = 1234;
            let sum = 0;

            while (num > 0) {
                sum += num % 10;
                num = parseInt(num / 10);
            }

            console.log(sum);
        }

        sumDigit();
        //---------20----------
        function palindrome() {

            let str = "MADAM";
            let rev = "";

            for (let i = str.length - 1; i >= 0; i--) {
                rev += str[i];
            }

            if (str == rev)
                console.log("Palindrome");
            else
                console.log("Not Palindrome");
        }

        palindrome();
