<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Arrays</h1>
    <script>
        //task 1
let fruits = ["Apple", "Banana", "Orange"];

fruits.push("Mango");
console.log("After Push:", fruits);

fruits.pop();
console.log("After Pop:", fruits);

fruits.shift();
console.log("After Shift:", fruits);

fruits.unshift("Grapes");
console.log("After Unshift:", fruits);
        //task 2
let fruitss = ["Apple", "Banana", "Orange", "Mango"];

for (let i = 0; i < fruitss.length; i++) {
    console.log(fruitss[i]);
}
        //task 3
let numbers = [2, 4, 6, 8];

let result = numbers.map(function(num) {
    return num * 2;
});

console.log(result);
        //task 4
let number = [1, 2, 3, 4, 5, 6, 7, 8];

let even = number.filter(function(num) {
    return num % 2 == 0;
});

console.log(even);
        //task 5
let numberss = [10, 20, 30, 40];

let sum = numberss.reduce(function(total, num) {
    return total + num;
}, 0);

console.log(sum);
        //task 6
let num = [3, 7, 9, 12, 15, 20];

let ruslt = num.find(function(numm) {
    return numm > 10;
});

console.log(ruslt);
        //task 7
        let fruit = ["Apple", "Banana", "Orange"];

console.log(fruit.includes("Banana"));
console.log(fruit.includes("Mango"));
    </script>
</body>
</html>
